name: Desktop acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:package
      - run: npm audit --omit=dev --audit-level=high
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-node${{ matrix.node }}
          path: '*.tgz'
